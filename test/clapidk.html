<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clapperboard Animation</title>
<style>
  @font-face {
    font-family: "Eraser";
    src: url("https://assets.codepen.io/8841541/eraser.regular.ttf");
    font-weight: normal;
    font-style: normal;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    background: white;
    height: 100%;
  }

  .text {
    color: #f1f1f1;
    text-transform: uppercase;
    font-style: italic;
    display: inline;
  }

  .text--padded {
    padding-left: 4px;
    padding-top: 2px;
  }

  .outercontainer {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* perspective for 3D effect */
    perspective: 1600px;
    -webkit-perspective: 1600px;

    /* prevent visual overflow (stops the vertical scrollbar glitch when we scale/translate the clapboard) */
    overflow: hidden;
  }

  .hinge {
    clip-path: polygon(0% 0%, 47% 0%, 100% 100%, 0% 100%);
    height: 100px;
    width: 100px;
    border: 0.1rem solid grey;
    z-index: 2;
    position: relative;
    background-color: #010101;
    left: 0;
    top: 100px;
    border-radius: 10px;
  }

  .hinge__rivet {
    display: block;
    font-size: 0.6rem;
    margin: 0;
  }

  .hinge__rivet--top {
    position: relative;
    left: 10px;
    top: 10px;
  }

  .hinge__rivet--bottomleft {
    position: relative;
    left: 10px;
    top: 50px;
  }

  .hinge__rivet--bottomright {
    position: relative;
    left: 60px;
    top: 33px;
  }

  .container {
    width: 500px;
    height: 500px;
    background-color: #000000;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    border-radius: 0 0 10px 10px;
  }

  /* ---------- CHANGE: increase visual size by scaling (no layout resize) + prepare for 3D ---------- */

  .clappercontainer {
    width: 500px;
    height: 100%;
    
    /* preserve 3D for children */
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    /* visual scale (increases overall size) - change only this value to scale more/less */
    --scale-factor: 0.5;
    transform-origin: center center;
    transform: scale(var(--scale-factor));
    transition: transform 0.12s ease-out;
    will-change: transform;
  }

  /* ---------- end size change ---------- */

  .clapper__top {
    width: 100%;
    height: 50px;
    background-color: #151515;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #000;
    overflow: hidden;
    border-radius: 10px 0 0 0;
  }

  .clapper__top--white {
    width: 15%;
    height: 100%;
    background-color: #f1f1f1;
    transform: skew(20deg);
  }

  .clapper__top--white:first-child {
    visibility: hidden;
  }

  .clapper__bottom {
    width: 100%;
    height: 50px;
    background-color: #151515;
    display: flex;
    justify-content: space-between;
    overflow: hidden;
  }

  .clapper__bottom--white {
    width: 15%;
    height: 100%;
    background-color: #f1f1f1;
    transform: skew(-20deg);
  }

  .info-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .scene-take-roll {
    width: 95%;
    height: 25%;
    display: flex;
    justify-content: space-around;
    border-top: 4px solid #f1f1f1;
    border-bottom: 4px solid #f1f1f1;
  }

  .scene, .take, .roll {
    width: 33%;
    height: 100%;
    background: #151515;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 0;
  }

  .scene__text, .take__text, .roll__text,
  .date__text, .prod__text, .sound__text,
  .director__text, .cinematographer__text {
    font-family: "Eraser";
    color: white;
    font-size: 1.5rem;
  }

  .scene, .take {
    border-right: 4px solid #f1f1f1;
  }

  .date-prod-sound {
    width: 95%;
    height: 25%;
    display: flex;
    justify-content: space-around;
    border-bottom: 4px solid #f1f1f1;
  }

  .date-prod {
    width: 60%;
    height: 100%;
  }

  .date, .prod {
    background: #151515;
    width: 100%;
    height: 50%;
    display: flex;
    border-right: 4px solid #f1f1f1;
  }

  .date {
    border-bottom: 4px solid #f1f1f1;
  }

  .sound {
    background: #151515;
    width: 40%;
  }

  .director {
    width: 95%;
    height: 15%;
    border-bottom: 4px solid #f1f1f1;
    background: #151515;
  }

  .cinematographer {
    width: 95%;
    height: 15%;
    border-bottom: 4px solid #f1f1f1;
    background: #151515;
  }

  @keyframes rotateUp {
    0% { transform: rotate(0deg); }
    96% { transform: rotate(-10deg); }
    100% { transform: rotate(0deg); }
  }

  .rotateUp {
    transform-origin: left center;
    animation: rotateUp 4s infinite;
  }

  /* original bottom overrides (kept exactly as in your file) */
    .container { width: 700px; height: 700px; }
  .clappercontainer { width: 700px; }
  .clapper__top, .clapper__bottom { height: 80px; }
  .hinge { width: 140px; height: 100px; }
  .scene__text, .take__text, .roll__text { font-size: 2rem; }

  /* ---------- small helpers for hover smoothing ---------- */
  .clappercontainer.hovering { transition: transform 0.06s ease-out; }

  body {
    display: flex;
    justify-content: center;  /* horizontal */
    align-items: center;      /* vertical */
    height: 100vh;            /* full screen height */
    margin: 0;
  }
</style>

</head>
<body>

<div class="outercontainer">
  <div class="clappercontainer">
    <div class="hinge">
      <p class="hinge__rivet hinge__rivet--top">⚪️</p>
      <p class="hinge__rivet hinge__rivet--bottomleft">⚪️</p>
      <p class="hinge__rivet hinge__rivet--bottomright">⚪️</p>
    </div>

    <div class="clapper__top rotateUp">
      <div class="clapper__top--white"></div>
      <div class="clapper__top--white"></div>
      <div class="clapper__top--white"></div>
      <div class="clapper__top--white"></div>
      <div class="clapper__top--white"></div>
    </div>

    <div class="container">
      <div class="clapper__bottom">
        <div class="clapper__bottom--white"></div>
        <div class="clapper__bottom--white"></div>
        <div class="clapper__bottom--white"></div>
        <div class="clapper__bottom--white"></div>
        <div class="clapper__bottom--white"></div>
      </div>

      <div class="info-container">
        <div class="scene-take-roll">
          <div class="scene">
            <p class="text">Scene:</p>
            <p class="scene__text">SPARK</p>
          </div>
          <div class="take">
            <p class="text">Take:</p>
            <p class="take__text">2</p>
          </div>
          <div class="roll">
            <p class="text">Roll:</p>
            <p class="roll__text">A</p>
          </div>
        </div>

        <div class="date-prod-sound">
          <div class="date-prod">
            <div class="date">
              <p class="text text--padded">Date:</p>
              <p class="date__text">May 2012</p>
            </div>
            <div class="prod">
              <p class="text text--padded">Place:</p>
              <p class="prod__text">NIT Calicut</p>
            </div>
          </div>
          <div class="sound">
            <p class="text text--padded">Sound:</p>
            <p class="sound__text">Echoes of Innovation</p>
          </div>
        </div>

        <div class="director">
          <p class="text text--padded">Faculty Supervisor:</p>
          <p class="director__text">Dr. Sudheer A.P.</p>
        </div>
        <div class="cinematographer">
          <p class="text text--padded">Team Captain:</p>
          <p class="cinematographer__text">Jibin Rajan Varghese</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Interaction script: cursor-driven 3D hover effect (only behavior change) -->
<script>
(function () {
  const container = document.querySelector('.clappercontainer');
  if (!container) return;

  // match the CSS scale
  const scaleStr = getComputedStyle(container).getPropertyValue('--scale-factor') || "1.0";
  const SCALE = parseFloat(scaleStr);

  // bounding rect refresh helpers
  let rect = container.getBoundingClientRect();
  const refreshRect = () => { rect = container.getBoundingClientRect(); };
  window.addEventListener('resize', refreshRect);
  window.addEventListener('scroll', refreshRect, true);

  // interaction parameters (tweak if you want stronger/weaker)
  const MAX_ROT_Y = 18; // degrees for left-right
  const MAX_ROT_X = 12; // degrees for up-down
  const BASE_Z = 6;     // base translateZ in px
  const EXTRA_Z = 40;   // additional depth based on distance

  let raf = null;

  function applyTransform(rx, ry, tz, immediate=false) {
    // include scale so visual size remains scaled
    const transform = `scale(${SCALE}) rotateY(${ry}deg) rotateX(${rx}deg) translateZ(${tz}px)`;
    container.style.transform = transform;
    if (immediate) container.style.transition = 'transform 0s';
  }

  container.addEventListener('mousemove', (e) => {
    // normalized coords -0.5 .. 0.5
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    const rotateY = x * MAX_ROT_Y;
    const rotateX = -y * MAX_ROT_X;

    const distance = Math.hypot(x, y);
    const translateZ = BASE_Z + distance * EXTRA_Z;

    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      applyTransform(rotateX, rotateY, translateZ);
    });
  });

  container.addEventListener('mouseenter', () => {
    // faster, snappier transition when moving starts
    container.classList.add('hovering');
    container.style.transition = 'transform 0.06s ease-out';
  });

  container.addEventListener('mouseleave', () => {
    container.classList.remove('hovering');
    // return to neutral (still keep visual scale)
    container.style.transition = 'transform 0.6s cubic-bezier(.2,.9,.2,1)';
    applyTransform(0, 0, 0);
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  });

  // ensure rect is accurate for initial interactions
  refreshRect();
})();
</script>

</body>
</html>
